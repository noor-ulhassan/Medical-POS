name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build Windows installers
    # Same image as CI: the smoke test cannot start Electron 22 on the windows-2025 image (see ci.yml).
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run smoke

      - name: Build installers (ia32 + x64)
        run: |
          npm run build:ui
          npx electron-builder --win --x64 --ia32 --publish never

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
