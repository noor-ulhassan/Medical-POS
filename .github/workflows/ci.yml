name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests, UI smoke test
    # Not windows-latest: on the windows-2025 image from 2026-10-21, Electron 22's GPU
    # process crashes at launch ("GPU process isn't usable") before the smoke test runs.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Boots the real Electron app against a throwaway data folder and drives
      # the UI end to end (login, sale, void, inventory, khata, settings).
      - run: npm run smoke
