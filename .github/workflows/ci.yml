name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests, UI smoke test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Boots the real Electron app against a throwaway data folder and drives
      # the UI end to end (login, sale, void, inventory, khata, settings).
      - run: npm run smoke
